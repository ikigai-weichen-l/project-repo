apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-app-dev-us-east-1
  namespace: argocd
  annotations:
    # Kargo uses this annotation to authorize in-memory image tag updates (no git commit)
    kargo.akuity.io/authorized-stage: my-app:dev
spec:
  project: default
  sources:
    # Source 1: Helm chart template from central repo
    - repoURL: https://github.com/YOUR_ORG/central-helm-repo
      targetRevision: main
      path: charts/app-template
      helm:
        valueFiles:
          - $values/envs/dev/us-east-1/values.yaml

    # Source 2: Environment-specific values from project repo
    # The `ref: values` makes this source referenceable as `$values` above
    - repoURL: https://github.com/YOUR_ORG/project-repo
      targetRevision: main
      ref: values

  destination:
    server: https://k8s-dev-us-east-1.example.com
    namespace: my-app-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
