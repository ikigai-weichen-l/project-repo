apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-app-prd-us-east-1
  namespace: argocd
  annotations:
    # PRD: Kargo commits only after manual Promote in Kargo UI
    kargo.akuity.io/authorized-stage: my-app:prd
spec:
  project: default
  sources:
    - repoURL: https://github.com/YOUR_ORG/central-helm-repo
      targetRevision: main
      path: charts/app-template
      helm:
        valueFiles:
          - $values/envs/prd/us-east-1/values.yaml

    - repoURL: https://github.com/YOUR_ORG/project-repo
      targetRevision: main
      ref: values

  destination:
    server: https://k8s-prd-us-east-1.example.com
    namespace: my-app-prd

  syncPolicy:
    # No automated sync for PRD — ArgoCD syncs after Kargo commits the git change
    syncOptions:
      - CreateNamespace=true
