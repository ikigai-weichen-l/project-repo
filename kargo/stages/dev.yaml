apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: kargo
spec:
  # DEV subscribes directly to Warehouse — every new image triggers promotion
  subscriptions:
    warehouse: my-app

  promotionTemplate:
    spec:
      steps:
        # Update image tag IN-MEMORY via ArgoCD parameter override.
        # No git commit. ArgoCD annotation controls which stage can do this.
        - uses: argocd-update
          config:
            apps:
              - name: my-app-dev-us-east-1
                namespace: argocd
                sources:
                  - repoURL: https://github.com/YOUR_ORG/central-helm-repo
                    helm:
                      images:
                        - image: mendhak/http-https-echo
                          key: image.tag
                          value: Tag

              - name: my-app-dev-ap-southeast-1
                namespace: argocd
                sources:
                  - repoURL: https://github.com/YOUR_ORG/central-helm-repo
                    helm:
                      images:
                        - image: mendhak/http-https-echo
                          key: image.tag
                          value: Tag
