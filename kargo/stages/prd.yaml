apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prd
  namespace: kargo
spec:
  # PRD subscribes to QAT stage
  subscriptions:
    stage: qat

  promotionTemplate:
    spec:
      steps:
        # Manual gate: promotion only runs after clicking "Promote" in Kargo UI.
        # The steps below are identical to QAT but target prd paths.

        - uses: git-clone
          config:
            repoURL: https://github.com/YOUR_ORG/project-repo
            checkout:
              - branch: main
                path: ./repo

        - uses: yaml-update
          config:
            path: ./repo/envs/prd/us-east-1/values.yaml
            updates:
              - key: image.tag
                value: ${{ imageFrom "mendhak/http-https-echo" | .Tag }}

        - uses: yaml-update
          config:
            path: ./repo/envs/prd/ap-southeast-1/values.yaml
            updates:
              - key: image.tag
                value: ${{ imageFrom "mendhak/http-https-echo" | .Tag }}

        - uses: git-commit
          config:
            path: ./repo
            message: "chore(prd): promote my-app to ${{ imageFrom \"mendhak/http-https-echo\" | .Tag }}"

        - uses: git-push
          config:
            path: ./repo

        # PRD ArgoCD apps have no automated sync — manual sync or triggered here
        - uses: argocd-update
          config:
            apps:
              - name: my-app-prd-us-east-1
                namespace: argocd
              - name: my-app-prd-ap-southeast-1
                namespace: argocd

  # PRD requires explicit manual promotion — no auto-promotion from QAT
  # Set this in Kargo UI: Stage > Settings > Promotion Policy > Manual
