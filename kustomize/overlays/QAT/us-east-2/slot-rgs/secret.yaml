apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: my-app-slot-rgs-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: demo-test-secret-store
    kind: ClusterSecretStore
  target:
    name: my-app-slot-rgs-secret
    creationPolicy: Owner
  data:
    - secretKey: API_KEY
      remoteRef:
        key: API_KEY
