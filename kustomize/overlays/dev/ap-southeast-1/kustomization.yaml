apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base

configMapGenerator:
  - name: my-app-config
    behavior: merge
    literals:
      - APP_ENV=dev
      - REGION=ap-southeast-1
      - LOG_LEVEL=debug
    options:
      disableNameSuffixHash: true

patches:
  - path: externalsecret-patch.yaml
