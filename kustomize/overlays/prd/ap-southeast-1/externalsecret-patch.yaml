apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: my-app-secret
spec:
  refreshInterval: "15m"
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: /prd/ap-southeast-1/my-app/database-url
    - secretKey: API_KEY
      remoteRef:
        key: /prd/ap-southeast-1/my-app/api-key
