apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base

configMapGenerator:
  - name: my-app-config
    behavior: merge
    literals:
      - APP_ENV=prd
      - REGION=us-east-1
      - LOG_LEVEL=warn
    options:
      disableNameSuffixHash: true

patches:
  - path: externalsecret-patch.yaml
