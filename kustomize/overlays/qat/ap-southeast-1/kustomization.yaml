apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - github.com/YOUR_ORG/central-helm-repo//base?ref=main

images:
  - name: ealen/echo-server
    newTag: latest    # Kargo updates this field

configMapGenerator:
  - name: my-app-config
    behavior: merge
    literals:
      - APP_ENV=qat
      - REGION=ap-southeast-1
      - LOG_LEVEL=info
    options:
      disableNameSuffixHash: true
